[project]
name = "student-tracker-system"
version = "1.0.0"
description = "Student Tracker System - Academic Management Platform"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Flask-Login>=0.6.3",
    "pymongo>=4.8.0",
    "mongomock>=4.1.2",
    "Werkzeug>=3.0.3",
    "python-dotenv>=1.0.1",
    "email-validator>=2.2.0",
    "setuptools<70.0.0"
]

[tool.vercel]
entrypoint = "api/index.py"
